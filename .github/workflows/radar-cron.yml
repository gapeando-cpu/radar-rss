name: Radar RSS

on:
  schedule:
    # Revision principal cada hora en punto. La ventana UTC cubre 7:00-23:00
    # hora de Madrid todo el ano (CET y CEST); radar.py recorta la hora exacta.
    - cron: "0 5-22 * * *"
    # Refuerzo 10 minutos despues: si GitHub se salta o retrasa la revision
    # principal, esta la cubre. Si la anterior ya corrio, se salta sola.
    - cron: "10 5-22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: radar-rss
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Saltar refuerzos redundantes
        id: guardia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'GUARDIA'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"])

          ejecutar = "true"
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              # Principal y refuerzo son intercambiables: si cualquier otra
              # ejecucion de este workflow empezo hace menos de 12 minutos,
              # esta sobra. Las ejecuciones manuales siempre corren.
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/radar.yml/runs?per_page=10",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  runs = json.load(resp)["workflow_runs"]
              ahora = datetime.now(timezone.utc)
              for run in runs:
                  if run["id"] == run_id:
                      continue
                  creado = datetime.fromisoformat(
                      run["created_at"].replace("Z", "+00:00"))
                  if ahora - creado < timedelta(minutes=12):
                      print("Ya hubo una revision hace "
                            f"{int((ahora - creado).total_seconds() // 60)} min; "
                            "esta sobra.")
                      ejecutar = "false"
                      break
          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              salida.write(f"ejecutar={ejecutar}\n")
          print("Ejecutar revision:", ejecutar)
          GUARDIA

      - name: Revisar fuentes y avisar
        if: steps.guardia.outputs.ejecutar == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

      - name: Guardar base de datos
        if: steps.guardia.outputs.ejecutar == 'true'
        run: |
          git config user.name "Radar RSS"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.db data/estado.json
          git diff --cached --quiet || (
            git commit -m "Actualizar estado del radar"
            git push
          )
